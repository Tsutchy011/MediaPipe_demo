<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>B-1 音楽教育｜指の速さと音の強さ</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== はじめの説明（スライド。shared/slides.js がここの先頭に入れる） ===== -->
  <section data-screen="intro" class="slides-screen">
    <div class="slide-foot">
      <span id="midiStatus" class="status">…</span>
      <span class="privacy-foot" data-text="privacy"></span>
      <button id="freeBtn" class="btn btn-small" data-text="freeButton"></button>
      <span class="staff-keys" data-text="staffKeys"></span>
    </div>
  </section>

  <!-- ===== 体験・結果・自由に試す ===== -->
  <div data-screen="main" hidden>
    <header class="topbar">
      <h1 data-text="title"></h1>
      <span id="modeLabel" class="status status-idle"></span>
      <span id="midiStatus2" class="status">…</span>
      <button id="homeBtn" class="btn btn-small" data-text="home"></button>
    </header>

    <main class="layout">
      <div class="left">
        <div class="video-wrap">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
          <canvas id="keys"></canvas>
          <div id="videoMsg" class="video-msg" hidden></div>
        </div>
        <div id="taskPanel" class="panel task">
          <p id="taskText" class="instruction"></p>
          <div id="dots" class="dots"></div>
          <p id="keyHint" class="muted" data-text="task.keyHint" hidden></p>
          <div class="task-actions">
            <button id="pad" class="btn pad" data-text="task.pad" hidden></button>
          </div>
        </div>
        <p id="freeHint" class="panel free-hint" data-text="free.hint" hidden></p>
      </div>

      <div class="right">
        <section id="liveView" class="panel">
          <canvas id="cSpeed" class="chart chart-tall"></canvas>
          <div id="scatterBox" hidden>
            <canvas id="scatter" class="chart scatter"></canvas>
            <button id="clearBtn" class="btn" data-text="free.clear"></button>
          </div>
        </section>

        <section id="resultView" class="panel" hidden>
          <h2 data-text="result.title"></h2>
          <div class="cmp">
            <div class="cmp-col">
              <h3 class="cmp-title weak" data-text="result.legendWeak"></h3>
              <canvas id="strobeWeak" class="strobe"></canvas>
              <div class="meter"><span data-text="result.meterSpeed"></span><div class="bar-track"><div id="mSpeedWeak" class="bar-fill weak"></div></div><b id="vSpeedWeak"></b></div>
              <div class="meter"><span><span data-text="result.meterVel"></span><small class="meter-sub" data-text="result.velHint"></small></span><div class="bar-track"><div id="mVelWeak" class="bar-fill weak"></div></div><b id="vVelWeak"></b></div>
            </div>
            <div class="cmp-col">
              <h3 class="cmp-title strong" data-text="result.legendStrong"></h3>
              <canvas id="strobeStrong" class="strobe"></canvas>
              <div class="meter"><span data-text="result.meterSpeed"></span><div class="bar-track"><div id="mSpeedStrong" class="bar-fill strong"></div></div><b id="vSpeedStrong"></b></div>
              <div class="meter"><span><span data-text="result.meterVel"></span><small class="meter-sub" data-text="result.velHint"></small></span><div class="bar-track"><div id="mVelStrong" class="bar-fill strong"></div></div><b id="vVelStrong"></b></div>
            </div>
          </div>
          <p class="muted small" data-text="result.strobeHint"></p>
          <div class="task-actions">
            <button id="replayBtn" class="btn" data-text="result.replay"></button>
          </div>
          <p id="compare" class="compare"></p>
          <p id="airNote" class="air-note" data-text="airPiano.note" hidden></p>
          <div class="task-actions">
            <button id="againBtn" class="btn" data-text="result.again"></button>
            <button id="finishBtn" class="btn btn-primary" data-text="result.finish"></button>
          </div>
        </section>
      </div>
    </main>

    <details class="staff">
      <summary data-text="staff.title"></summary>
      <div class="row">
        <label><span data-text="staff.camera"></span> <select id="camSelect"></select></label>
        <label><input type="checkbox" id="mirror"> <span data-text="staff.mirror"></span></label>
        <label><input type="checkbox" id="sound"> <span data-text="staff.sound"></span></label>
        <button id="dummyBtn" class="btn" data-text="staff.dummy"></button>
        <label><input type="checkbox" id="mockMidi"> <span data-text="staff.mockmidi"></span></label>
        <span id="camStatus" class="status">…</span>
      </div>
      <p data-text="staff.keys"></p>
    </details>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
