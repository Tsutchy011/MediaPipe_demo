<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking Analysis - MediaPipe Demo</title>

    <!-- External Libs -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/demo_style.css">

    <!-- Local Logic (Loaded as Globals) -->
    <script src="js/DataRecorder.js"></script>
    <script src="js/MediaRecorder.js"></script>
    <script src="js/AudioAnalyzer.js"></script>
    <script src="js/CameraManager.js"></script>
    <script src="js/TutorialManager.js"></script>
    <script src="js/DemoCore.js"></script>

    <style>
        /* Tutorial Styles */
        .tutorial-overlay {
            pointer-events: auto !important;
        }

        .tutorial-popup {
            z-index: 10000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="logo"><a href="../../MediaPipe_demo_top.html" style="color:white; text-decoration:none;">MediaPipe
                Demo :: Hands (日本語)</a></div>
        <div>
            <a href="../../../demo.html"
                style="font-size: 0.8rem; color:white; opacity: 0.7; text-decoration:none;">サイトに戻る</a>
        </div>
        <button class="sidebar-toggle">☰</button>
    </header>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar-overlay"></div>
        <div class="sidebar">
            <div class="control-group">
                <div class="group-title">ステータス</div>
                <div id="status-display" class="status-indicator">起動中...</div>
            </div>

            <div class="control-group">
                <div class="group-title">録画コントロール</div>
                <button id="btn-record" class="btn btn-primary">録画開始</button>
                <div style="display:flex; gap:5px; margin-top:5px;">
                    <button id="btn-download-video" class="btn" style="flex:1;">動画保存</button>
                </div>
            </div>

            <div class="control-group">
                <div class="group-title">分析</div>
                <div style="display:flex; gap:5px; margin-bottom:5px;">
                    <button id="btn-analysis-start" class="btn btn-primary" style="flex:1;">分析開始</button>
                    <button id="btn-analysis-stop" class="btn btn-danger" style="flex:1;" disabled>分析終了</button>
                </div>
                <button id="btn-analysis-calc" class="btn" disabled>録音を音響分析する</button>
                <button id="btn-analysis-download" class="btn" style="margin-top:5px;" disabled>音声保存 (WAV)</button>
            </div>



            <div class="control-group">
                <div class="group-title">設定</div>
                <label class="checkbox-label"><input type="checkbox" id="check-mirror" checked> 左右反転 (ミラー)</label>
                <label class="checkbox-label"><input type="checkbox" id="check-image" checked> カメラ映像を表示</label>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Visualizer -->
            <div class="visualizer-area">
                <div id="loading" class="loading-overlay">カメラ起動中...</div>
                <video id="input_video" class="input_video" autoplay playsinline muted></video>
                <canvas id="output_canvas" class="output_canvas"></canvas>
            </div>

            <!-- Analysis Panel -->
            <div class="analysis-panel">
                <div class="chart-card">
                    <div class="chart-title">オーディオスペクトル</div>
                    <canvas id="spectrumCanvas"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title">オーディオ波形</div>
                    <canvas id="waveformCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        window.addEventListener('load', () => {
            // Initialize elements
            const videoElement = document.getElementById('input_video');
            const canvasElement = document.getElementById('output_canvas');
            const loadingOverlay = document.getElementById('loading');

            // Setup DemoCore (Logic)
            const demo = new DemoCore(videoElement, canvasElement);

            // Sync Settings on Load
            demo.config.mirror = document.getElementById('check-mirror').checked;
            demo.config.showImage = document.getElementById('check-image').checked;

            // Handle Offline Analysis Result
            demo.onAnalysisResult = (result) => {
                // Visualize LTAS on Spectrum Canvas
                const spectrumCanvas = document.getElementById('spectrumCanvas');
                if (spectrumCanvas && result.ltas) {
                    const ctx = spectrumCanvas.getContext('2d');
                    // Overlay or Clear?
                    // Let's draw it in a different color (Yellow) overlaying the real-time or just show it static.
                    // Since analysis stops real-time loop usually (or runs parallel), let's clear and draw static.
                    ctx.fillStyle = '#222';
                    ctx.fillRect(0, 0, spectrumCanvas.width, spectrumCanvas.height);

                    const data = result.ltas;
                    const barWidth = (spectrumCanvas.width / data.length) * 2.5;
                    let x = 0;
                    ctx.fillStyle = '#ffcc00'; // Gold for LTAS

                    for (let i = 0; i < data.length; i++) {
                        // Magnitude might be different scaling than byte freq data [0-255].
                        // FFT returns raw magnitude. Need log scaling or auto-scale.
                        // Simple auto-scale for demo:
                        const h = (data[i] / 50) * spectrumCanvas.height; // Arbitrary scale factor
                        ctx.fillRect(x, spectrumCanvas.height - h, barWidth, h);
                        x += barWidth + 1;
                    }

                    // Label
                    ctx.fillStyle = '#fff';
                    ctx.font = "12px Arial";
                    ctx.fillText("長期平均スペクトル (LTAS)", 10, 20);

                    // Label Centroid
                    if (result.centroid) {
                        ctx.fillStyle = '#00ff00';
                        ctx.fillText("スペクトル重心: " + result.centroid.toFixed(0) + " Hz", 10, 40);
                    }
                }
            };

            // Define Drawing Logic
            demo.drawResults = (results) => {
                const canvasCtx = demo.canvasCtx;
                const w = canvasElement.width;
                const h = canvasElement.height;

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, w, h);

                if (demo.config.mirror) {
                    canvasCtx.scale(-1, 1);
                    canvasCtx.translate(-w, 0);
                }

                // Draw Image
                if (demo.config.showImage) {
                    canvasCtx.drawImage(results.image, 0, 0, w, h);
                } else {
                    canvasCtx.fillStyle = '#000';
                    canvasCtx.fillRect(0, 0, w, h);
                }

                // Draw Landmarks
                if (results.multiHandLandmarks) {
                    for (const landmarks of results.multiHandLandmarks) {
                        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 5 });
                        drawLandmarks(canvasCtx, landmarks, { color: '#FF0000', lineWidth: 2 });
                    }
                }
                canvasCtx.restore();
            };

            // Setup Hands
            const hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }
            });
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            hands.onResults((results) => {
                loadingOverlay.classList.add('hidden');
                demo.onResults(results);
            });

            // Setup Camera
            const camera = new CameraManager(videoElement, {
                onFrame: async () => {
                    if (!demo.isPlayingBack) {
                        await hands.send({ image: videoElement });
                    }
                },
                width: 1920,
                height: 1080
            });

            // Resize Canvas to match Video
            videoElement.addEventListener('loadedmetadata', () => {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            });

            // Sync UI Controls (Handled by DemoCore)
            document.getElementById('check-mirror').addEventListener('change', (e) => {
                demo.config.mirror = e.target.checked;
            });
            document.getElementById('check-image').addEventListener('change', (e) => {
                demo.config.showImage = e.target.checked;
            });

            // Loop for Analysis Visualization (Spectrum + Waveform)
            const spectrumCanvas = document.getElementById('spectrumCanvas');
            const waveformCanvas = document.getElementById('waveformCanvas');

            function analysisLoop() {
                requestAnimationFrame(analysisLoop);

                if (!demo.isAnalyzingRealtime) return;

                if (demo.audioAnalyzer.analyser) {
                    const freqData = demo.audioAnalyzer.getFrequencyData();
                    const waveData = demo.audioAnalyzer.getWaveformData();

                    // Spectrum
                    if (spectrumCanvas) {
                        const ctx = spectrumCanvas.getContext('2d');
                        ctx.fillStyle = '#222';
                        ctx.fillRect(0, 0, spectrumCanvas.width, spectrumCanvas.height);
                        const barWidth = (spectrumCanvas.width / freqData.length) * 2.5;
                        let x = 0;
                        for (let i = 0; i < freqData.length; i++) {
                            const h = (freqData[i] / 255) * spectrumCanvas.height;
                            ctx.fillStyle = `hsl(${i / freqData.length * 360}, 100%, 50%)`;
                            ctx.fillRect(x, spectrumCanvas.height - h, barWidth, h);
                            x += barWidth + 1;
                        }
                    }

                    // Waveform
                    if (waveformCanvas) {
                        const ctx = waveformCanvas.getContext('2d');
                        ctx.fillStyle = '#222';
                        ctx.fillRect(0, 0, waveformCanvas.width, waveformCanvas.height);
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = '#00ff00';
                        ctx.beginPath();

                        const sliceWidth = waveformCanvas.width * 1.0 / waveData.length;
                        let x = 0;
                        for (let i = 0; i < waveData.length; i++) {
                            const v = waveData[i] / 128.0;
                            const y = v * waveformCanvas.height / 2;
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                            x += sliceWidth;
                        }
                        ctx.lineTo(waveformCanvas.width, waveformCanvas.height / 2);
                        ctx.stroke();
                    }
                }
            }
            analysisLoop();

            // Start Camera
            camera.start().catch(e => {
                loadingOverlay.textContent = "Camera Error: " + e.message;
            });
        });
    </script>
</body>

</html>
